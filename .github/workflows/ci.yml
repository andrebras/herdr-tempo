name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default: no step needs to write to the repository.
permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs on main are never cancelled, so
# every merge is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # Herdr reads the mod's mod.json. GitHub can't run `herdr-app check`, so at least make
      # sure the file is valid JSON (JavaScript Object Notation) and holds an object.
      - name: Validate mod.json
        run: >-
          node -e 'const m = JSON.parse(require("fs").readFileSync("mods/tempo/mod.json", "utf8"));
          if (!m || typeof m !== "object" || Array.isArray(m)) throw new Error("mod.json is not an object");'
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
